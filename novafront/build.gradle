plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    version = '22.14.0'
    npmVersion = '10.9.2'
    download = true
    nodeProjectDir = projectDir
}

tasks.register('npmBuild', NpmTask) {
    group = 'frontend'
    description = 'Builds the Vite frontend.'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
}

tasks.register('npmLint', NpmTask) {
    group = 'verification'
    description = 'Runs ESLint for the frontend.'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'lint']
}

tasks.register('npmDev', NpmTask) {
    group = 'application'
    description = 'Starts the Vite development server.'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'dev']
}

tasks.named('assemble') {
    dependsOn 'npmBuild'
}
