map $http_x_forwarded_host $nova_forwarded_host {
  default $http_x_forwarded_host;
  "" $host;
}

map $http_x_forwarded_proto $nova_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $nova_forwarded_host;
    proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
  }

  location /oauth2/ {
    proxy_pass http://api-gateway:8081/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $nova_forwarded_host;
    proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
  }

  location /login/oauth2/ {
    proxy_pass http://api-gateway:8081/login/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $nova_forwarded_host;
    proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
