      <html lang="en">
        <head>
          <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
          <meta name="color-scheme" content="dark">
          <meta name="supported-color-schemes" content="dark">
          <title>NovaFlow account invitation</title>
          <style>
            :root { color-scheme: dark; supported-color-schemes: dark; }
            body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
            body { margin:0; padding:0; background:#100d14 !important; }
          </style>
        </head>
        <body bgcolor="#100d14" style="margin:0;padding:0;background:#100d14;color:#fffffe;font-family:Arial,Helvetica,sans-serif;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#100d14" style="width:100%;background-color:#100d14;background-image:linear-gradient(135deg,#100d14 0%,#2b0a4f 50%,#100d14 100%);">
            <tr>
              <td align="center" style="padding:48px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:584px;">
                  <tr>
                    <td style="padding:0 4px 16px;">
                      <div style="font-size:30px;line-height:1.2;font-weight:400;color:#fffffe;">NovaFlow</div>
                      <div style="margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#908df7;">Workspace invitation</div>
                    </td>
                  </tr>
                  <tr>
                    <td bgcolor="#17151b" style="background:#17151b;border:1px solid #2b2532;border-radius:8px;overflow:hidden;">
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                          <td bgcolor="#7f5af0" style="height:4px;line-height:4px;font-size:0;">&nbsp;</td>
                        </tr>
                        <tr>
                          <td style="padding:34px 32px 32px;">
                            <h1 style="margin:0 0 14px;font-size:26px;font-weight:400;line-height:1.25;color:#fffffe;">You have been invited</h1>
                            <p style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#c9c5cf;">
