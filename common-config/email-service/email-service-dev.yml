app:
  mail:
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@novaflow.local}
    from-name: ${EMAIL_FROM_NAME:NovaFlow}
    account-activation-url: http://localhost:8081/api-gateway/api/account/activate
    reset-password-url: http://localhost:8081/api-gateway/api/reset/password
    collaborator-invite-url: http://localhost:8081/api-gateway/api/invite/collaborator
    base-redirect-url: http://localhost:8081/api/link?t=
    activate-account-subject: Verify your NovaFlow account
    activate-account-message-body: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
          <meta name="color-scheme" content="dark">
          <meta name="supported-color-schemes" content="dark">
          <title>Verify your NovaFlow account</title>
          <style>
            :root { color-scheme: dark; supported-color-schemes: dark; }
            body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
            body { margin:0; padding:0; background:#100d14 !important; }
          </style>
        </head>
        <body bgcolor="#100d14" style="margin:0;padding:0;background:#100d14;color:#fffffe;font-family:Arial,Helvetica,sans-serif;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#100d14" style="width:100%;background-color:#100d14;background-image:linear-gradient(135deg,#100d14 0%,#2b0a4f 50%,#100d14 100%);">
            <tr>
              <td align="center" style="padding:48px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:584px;">
                  <tr>
                    <td style="padding:0 4px 16px;">
                      <div style="font-size:30px;line-height:1.2;font-weight:400;color:#fffffe;">NovaFlow</div>
                      <div style="margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#908df7;">Account activation</div>
                    </td>
                  </tr>
                  <tr>
                    <td bgcolor="#17151b" style="background:#17151b;border:1px solid #2b2532;border-radius:8px;overflow:hidden;">
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                          <td bgcolor="#7f5af0" style="height:4px;line-height:4px;font-size:0;">&nbsp;</td>
                        </tr>
                        <tr>
                          <td style="padding:34px 32px 32px;">
                            <h1 style="margin:0 0 14px;font-size:26px;font-weight:400;line-height:1.25;color:#fffffe;">Verify your account</h1>
                            <p style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#c9c5cf;">
                              Welcome to NovaFlow. Confirm this email address to activate your account and start using your workspace.
                            </p>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                              <tr>
                                <td bgcolor="#908df7" style="border-radius:6px;background:#908df7;">
                                  <a href="%s" style="display:inline-block;padding:14px 22px;color:#100d14;font-size:16px;font-weight:700;text-decoration:none;">Verify email address</a>
                                </td>
                              </tr>
                            </table>
                            <p style="margin:26px 0 0;font-size:14px;line-height:1.7;color:#9d98a6;">
                              This link expires after 24 hours and can only be used once.
                            </p>
                            <p style="margin:22px 0 0;padding-top:22px;border-top:1px solid #2b2532;font-size:13px;line-height:1.6;color:#77717f;">
                              If you did not create a NovaFlow account, you can safely ignore this email.
                            </p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </body>
      </html>
    reset-password-subject: Reset your NovaFlow password
    reset-password-message-body: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
          <meta name="color-scheme" content="dark">
          <meta name="supported-color-schemes" content="dark">
          <title>Reset your NovaFlow password</title>
          <style>
            :root { color-scheme: dark; supported-color-schemes: dark; }
            body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
            body { margin:0; padding:0; background:#100d14 !important; }
          </style>
        </head>
        <body bgcolor="#100d14" style="margin:0;padding:0;background:#100d14;color:#fffffe;font-family:Arial,Helvetica,sans-serif;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#100d14" style="width:100%;background-color:#100d14;background-image:linear-gradient(135deg,#100d14 0%,#2b0a4f 50%,#100d14 100%);">
            <tr>
              <td align="center" style="padding:48px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:584px;">
                  <tr>
                    <td style="padding:0 4px 16px;">
                      <div style="font-size:30px;line-height:1.2;font-weight:400;color:#fffffe;">NovaFlow</div>
                      <div style="margin-top:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#908df7;">Password security</div>
                    </td>
                  </tr>
                  <tr>
                    <td bgcolor="#17151b" style="background:#17151b;border:1px solid #2b2532;border-radius:8px;overflow:hidden;">
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                          <td bgcolor="#7f5af0" style="height:4px;line-height:4px;font-size:0;">&nbsp;</td>
                        </tr>
                        <tr>
                          <td style="padding:34px 32px 32px;">
                            <h1 style="margin:0 0 14px;font-size:26px;font-weight:400;line-height:1.25;color:#fffffe;">Confirm your password reset</h1>
                            <p style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#c9c5cf;">
                              Your NovaFlow password was reset. Confirm this action to finish securing the account.
                            </p>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                              <tr>
                                <td bgcolor="#908df7" style="border-radius:6px;background:#908df7;">
                                  <a href="%s" style="display:inline-block;padding:14px 22px;color:#100d14;font-size:16px;font-weight:700;text-decoration:none;">Confirm reset</a>
                                </td>
                              </tr>
                            </table>
                            <p style="margin:26px 0 0;font-size:14px;line-height:1.7;color:#9d98a6;">
                              If you did not request a password reset, you can safely ignore this email.
                            </p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </body>
      </html>
    invitation-subject: NovaFlow account invitation
    invitation-message-body: |
