spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${USER_SERVICE_DB_NAME:user_service_db}
    username: ${DB_USERNAME:${POSTGRES_USER:sa}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
novaflow:
  internal-service-key: ${INTERNAL_SERVICE_KEY}
