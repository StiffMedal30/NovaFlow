server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: chat-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:builder/.env[.properties]
      - optional:file:../builder/.env[.properties]
      - configserver:http://localhost:7090/

  cloud:
    config:
      uri: http://localhost:7090/  # Location of config server
      fail-fast: false
      retry:
        max-attempts: 10
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
