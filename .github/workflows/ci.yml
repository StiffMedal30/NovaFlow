name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build services and frontend
        run: ./gradlew clean buildAll :config-server:build :novafront:npmLint --no-daemon

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Testcontainers integration tests
        run: ./gradlew integrationTest --no-daemon

  compose-validation:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ci-postgres-password
      DB_USERNAME: sa
      DB_PASSWORD: ci-postgres-password
      PGADMIN_DEFAULT_EMAIL: admin@novaflow.local
      PGADMIN_DEFAULT_PASSWORD: ci-pgadmin-password
      RABBITMQ_USERNAME: novaflow
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      JWT_SECRET: ci-jwt-secret-value
      INTERNAL_SERVICE_KEY: ci-internal-service-key
      FRONTEND_BASE_URL: https://novaflow.example.test
      PUBLIC_API_URL: https://api.novaflow.example.test
      OPENAI_API_KEY: ci-openai-api-key
      EMAIL_HOST: smtp.example.test
      EMAIL_FROM_ADDRESS: no-reply@novaflow.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate local infrastructure compose
        run: docker compose -f builder/docker-compose.local.yml config --quiet

      - name: Validate full local stack compose
        run: docker compose -f builder/docker-compose.yml config --quiet

      - name: Validate production compose
        run: docker compose -f builder/production-release/docker-compose.production.yml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false

  app-image-builds:
    name: Build app Docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'develop' || startsWith(github.ref_name, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - idea-service
          - ai-service
          - chat-service
          - email-service
          - novafront

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.service }} image
        run: ./gradlew serviceImage -Pservice=${{ matrix.service }} --no-daemon
