name: Production deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated services to deploy, or all for the app release set."
        required: false
        default: "all"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://novaflow.dotze.co.za

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare deployment metadata
        id: meta
        shell: bash
        run: |
          set -eu

          default_services="config-server user-service idea-service ai-service chat-service email-service api-gateway novafront"
          requested="${{ github.event.inputs.services }}"

          if [ -z "$requested" ] || [ "$requested" = "all" ]; then
            services="$default_services"
          else
            services="$requested"
          fi

          allowed_services=" api-gateway user-service idea-service ai-service chat-service email-service novafront config-server "
          for service in $services; do
            case "$allowed_services" in
              *" $service "*) ;;
              *)
                echo "::error title=Unknown service::$service is not deployable by this workflow."
                exit 1
                ;;
            esac
          done

          repository="${GITHUB_REPOSITORY,,}"
          image_prefix="ghcr.io/$repository"
          image_tag="${GITHUB_SHA::12}"

          {
            echo "services=$services"
            echo "image_prefix=$image_prefix"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Services: $services"
          echo "Image prefix: $image_prefix"
          echo "Image tag: $image_tag"

      - name: Validate required deployment settings
        shell: bash
        env:
          PRODUCTION_AWS_ROLE_ARN: ${{ vars.PRODUCTION_AWS_ROLE_ARN || secrets.PRODUCTION_AWS_ROLE_ARN }}
          PRODUCTION_SSM_INSTANCE_ID: ${{ vars.PRODUCTION_SSM_INSTANCE_ID || secrets.PRODUCTION_SSM_INSTANCE_ID }}
        run: |
          set -eu
          missing=0

          for name in PRODUCTION_AWS_ROLE_ARN PRODUCTION_SSM_INSTANCE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing production setting::$name is not configured."
              missing=1
            fi
          done

          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_AWS_ROLE_ARN || secrets.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRODUCTION_AWS_REGION || 'us-east-1' }}

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Make release scripts executable
        run: chmod +x ./gradlew builder/production-release/build-images.sh builder/production-release/deploy-stack.sh

      - name: Build and publish production images
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          PUSH_IMAGES: "1"
          PULL_EXTERNAL_IMAGES: "0"
          SKIP_GIT_PULL: "1"
        run: sh builder/production-release/build-images.sh ${{ steps.meta.outputs.services }}

      - name: Deploy on EC2 with SSM
        shell: bash
        env:
          PRODUCTION_AWS_REGION: ${{ vars.PRODUCTION_AWS_REGION || 'us-east-1' }}
          PRODUCTION_SSM_INSTANCE_ID: ${{ vars.PRODUCTION_SSM_INSTANCE_ID || secrets.PRODUCTION_SSM_INSTANCE_ID }}
          PRODUCTION_DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
          PRODUCTION_DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          PRODUCTION_GHCR_USERNAME_PARAMETER: ${{ vars.PRODUCTION_GHCR_USERNAME_PARAMETER }}
          PRODUCTION_GHCR_TOKEN_PARAMETER: ${{ vars.PRODUCTION_GHCR_TOKEN_PARAMETER }}
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          DEPLOY_SERVICES: ${{ steps.meta.outputs.services }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu

          deploy_path="${PRODUCTION_DEPLOY_PATH:-/opt/novaflow}"
          deploy_user="${PRODUCTION_DEPLOY_USER:-ubuntu}"
          ghcr_username_parameter="${PRODUCTION_GHCR_USERNAME_PARAMETER:-/novaflow/production/ghcr/username}"
          ghcr_token_parameter="${PRODUCTION_GHCR_TOKEN_PARAMETER:-/novaflow/production/ghcr/token}"

          export deploy_path deploy_user ghcr_username_parameter ghcr_token_parameter

          python3 <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          service_args = " ".join(shlex.quote(service) for service in os.environ["DEPLOY_SERVICES"].split())

          def quoted(name):
              return shlex.quote(os.environ[name])

          remote_deploy_script = f"""#!/usr/bin/env sh
          set -eu

          deploy_path={quoted("deploy_path")}
          aws_region={quoted("PRODUCTION_AWS_REGION")}
          deploy_ref={quoted("DEPLOY_REF")}
          deploy_sha={quoted("DEPLOY_SHA")}
          image_prefix={quoted("IMAGE_PREFIX")}
          image_tag={quoted("IMAGE_TAG")}
          ghcr_username_parameter={quoted("ghcr_username_parameter")}
          ghcr_token_parameter={quoted("ghcr_token_parameter")}

          if ! command -v aws >/dev/null 2>&1; then
              echo "AWS CLI is required on EC2 so the deploy can read GHCR credentials from Parameter Store." >&2
              exit 1
          fi

          cd "$deploy_path"

          echo "Deploying NovaFlow $deploy_sha from $deploy_ref"
          git fetch --prune origin "$deploy_ref"
          git checkout -f "$deploy_sha"

          ghcr_username=$(aws ssm get-parameter --name "$ghcr_username_parameter" --with-decryption --query 'Parameter.Value' --output text --region "$aws_region")
          ghcr_token=$(aws ssm get-parameter --name "$ghcr_token_parameter" --with-decryption --query 'Parameter.Value' --output text --region "$aws_region")
          printf '%s\\n' "$ghcr_token" | docker login ghcr.io -u "$ghcr_username" --password-stdin

          IMAGE_PREFIX="$image_prefix" IMAGE_TAG="$image_tag" PULL_IMAGES=1 SKIP_PULL=0 GIT_PULL_MODE=none sh builder/production-release/deploy-stack.sh {service_args}
          """

          command = f"""set -eu
          tmp_script=/tmp/novaflow-ssm-deploy.sh
          trap 'rm -f "$tmp_script"' EXIT
          cat > "$tmp_script" <<'NOVAFLOW_DEPLOY'
          {remote_deploy_script}
          NOVAFLOW_DEPLOY
          chmod 700 "$tmp_script"
          chown {quoted("deploy_user")} "$tmp_script"
          sudo -iu {quoted("deploy_user")} sh "$tmp_script"
          """

          Path("ssm-parameters.json").write_text(json.dumps({
              "commands": [command],
              "executionTimeout": ["3600"],
          }))
          PY

          command_id=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$PRODUCTION_SSM_INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --comment "NovaFlow production deploy $DEPLOY_SHA" \
            --timeout-seconds 600 \
            --max-concurrency "1" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: $command_id"

          print_invocation_output() {
            echo "::group::SSM stdout"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$PRODUCTION_SSM_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true
            echo "::endgroup::"

            echo "::group::SSM stderr"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$PRODUCTION_SSM_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true
            echo "::endgroup::"
          }

          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$PRODUCTION_SSM_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                echo "SSM deploy finished successfully."
                print_invocation_output
                exit 0
                ;;
              Cancelled|Cancelling|Failed|TimedOut)
                echo "::error title=SSM deploy failed::Command $command_id finished with status $status."
                print_invocation_output
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                echo "SSM deploy status: ${status:-waiting}"
                sleep 10
                ;;
              *)
                echo "SSM deploy status: $status"
                sleep 10
                ;;
            esac
          done

          echo "::error title=SSM deploy timed out::Command $command_id did not finish before the workflow timeout."
          print_invocation_output
          exit 1
