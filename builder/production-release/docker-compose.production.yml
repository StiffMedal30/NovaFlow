name: novaflow-production

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-sa}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or DB_PASSWORD from a production secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - app-network
    volumes:
      - ../init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-novaflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD from a production secret}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.1}
    container_name: mailpit
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - app-network
    restart: always

  eureka:
    image: ${EUREKA_IMAGE:-steeltoeoss/eureka-server}
    container_name: eureka-server
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    environment:
      EUREKA_CLIENT_REGISTERWITH_EUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
      EUREKA_SERVER_ENABLESELFPRESERVATION: "false"
      SPRING_APPLICATION_NAME: discovery-server
    networks:
      - app-network
    restart: always

  config-server:
    image: ${CONFIG_SERVER_IMAGE:-config-server:latest}
    container_name: config-server
    depends_on:
      - eureka
    ports:
      - "${CONFIG_SERVER_HOST_PORT:-7090}:7090"
    volumes:
      - ../../common-config:/config:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config/{application},file:/config
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET from a production secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
    networks:
      - app-network
    restart: always

  user-service:
    image: ${IMAGE_PREFIX:-}user-service:${IMAGE_TAG:-latest}
    container_name: user-service
    depends_on:
      - eureka
      - config-server
      - postgres
      - rabbitmq
    ports:
      - "${USER_SERVICE_HOST_PORT:-7010}:8082"
    environment:
      - DB_USERNAME=${DB_USERNAME:-${POSTGRES_USER:-sa}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD from a production secret}}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-novaflow}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD from a production secret}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET from a production secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY from a production secret}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
    networks:
      - app-network
    restart: always

  email-service:
    image: ${IMAGE_PREFIX:-}email-service:${IMAGE_TAG:-latest}
    container_name: email-service
    depends_on:
      - eureka
      - config-server
      - rabbitmq
      - mailpit
    ports:
      - "${EMAIL_SERVICE_HOST_PORT:-8050}:8050"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-novaflow}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD from a production secret}
      - EMAIL_HOST=${PRODUCTION_EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${PRODUCTION_EMAIL_PORT:-1025}
      - EMAIL_USERNAME=${PRODUCTION_EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${PRODUCTION_EMAIL_PASSWORD:-}
      - EMAIL_SMTP_AUTH=${PRODUCTION_EMAIL_SMTP_AUTH:-false}
      - EMAIL_STARTTLS=${PRODUCTION_EMAIL_STARTTLS:-false}
      - EMAIL_SSL_ENABLE=${PRODUCTION_EMAIL_SSL_ENABLE:-false}
      - EMAIL_FROM_ADDRESS=${PRODUCTION_EMAIL_FROM_ADDRESS:-no-reply@novaflow.local}
      - EMAIL_FROM_NAME=${PRODUCTION_EMAIL_FROM_NAME:-NovaFlow}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8081}
    networks:
      - app-network
    restart: always

  idea-service:
    image: ${IMAGE_PREFIX:-}idea-service:${IMAGE_TAG:-latest}
    container_name: idea-service
    depends_on:
      - eureka
      - config-server
      - postgres
    ports:
      - "${IDEA_SERVICE_HOST_PORT:-7020}:8083"
    environment:
      - DB_USERNAME=${DB_USERNAME:-${POSTGRES_USER:-sa}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD from a production secret}}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
    networks:
      - app-network
    restart: always

  ai-service:
    image: ${IMAGE_PREFIX:-}ai-service:${IMAGE_TAG:-latest}
    container_name: ai-service
    depends_on:
      - eureka
      - config-server
      - postgres
    ports:
      - "${AI_SERVICE_HOST_PORT:-7030}:8084"
    environment:
      - DB_USERNAME=${DB_USERNAME:-${POSTGRES_USER:-sa}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD from a production secret}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?Set OPENAI_API_KEY from a production secret}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.2}
      - OPENAI_REFINEMENT_MODEL=${OPENAI_REFINEMENT_MODEL:-gpt-5.2}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
    networks:
      - app-network
    restart: always

  api-gateway:
    image: ${IMAGE_PREFIX:-}api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    depends_on:
      - eureka
      - config-server
    ports:
      - "${API_GATEWAY_HOST_PORT:-8081}:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET from a production secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY from a production secret}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL for production}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
    networks:
      - app-network
    restart: always

  chat-service:
    image: ${IMAGE_PREFIX:-}chat-service:${IMAGE_TAG:-latest}
    container_name: chat-service
    depends_on:
      - eureka
      - config-server
    ports:
      - "${CHAT_SERVICE_HOST_PORT:-8085}:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:7090/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:7090
      - CONFIG_SERVER_URL=http://config-server:7090/
    networks:
      - app-network
    restart: always

  novafront:
    image: ${IMAGE_PREFIX:-}novafront:${IMAGE_TAG:-latest}
    container_name: novafront
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
