plugins {
    id 'base'
}

group = 'za.co.novaflow'
version = '0.0.1-SNAPSHOT'

allprojects {
    layout.buildDirectory = layout.projectDirectory.dir('target')
}

def springProjects = [
    project(':ai-service'),
    project(':api-gateway'),
    project(':chat-service'),
    project(':config-server'),
    project(':email-service'),
    project(':idea-service'),
    project(':user-service')
]

def localApplicationProjects = springProjects.findAll {
    it.path != ':config-server'
}

def sharedProjects = [
    project(':notification-contracts')
]

def rootEnvironment = {
    def envFile = rootProject.file('.env')
    if (!envFile.exists()) {
        return [:]
    }

    envFile.readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') && it.contains('=') }
        .collectEntries { line ->
            def separator = line.indexOf('=')
            def key = line.substring(0, separator).trim()
            def value = line.substring(separator + 1).trim()
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            [(key): value]
        }
}

def deployableServices = (springProjects*.name + ['novafront']).sort()
def requestedService = {
    def serviceName = providers.gradleProperty('service').orNull
    if (!serviceName) {
        throw new GradleException(
            "Missing service name. Use -Pservice=<name>. Available services: ${deployableServices.join(', ')}"
        )
    }
    if (!deployableServices.contains(serviceName)) {
        throw new GradleException(
            "Unknown service '${serviceName}'. Available services: ${deployableServices.join(', ')}"
        )
    }
    serviceName
}

springProjects.each { applicationProject ->
    applicationProject.pluginManager.withPlugin('org.springframework.boot') {
        applicationProject.tasks.named('bootRun') {
            workingDir = applicationProject.projectDir
            environment rootEnvironment()
        }
        applicationProject.tasks.named('jar') {
            enabled = false
        }
    }
}

tasks.register('backendBuild') {
    group = 'build'
    description = 'Builds all locally run Spring services.'
    dependsOn((sharedProjects + localApplicationProjects).collect { "${it.path}:build" })
}

tasks.register('backendClasses') {
    group = 'build'
    description = 'Compiles all locally run Spring services without running tests.'
    dependsOn((sharedProjects + localApplicationProjects).collect { "${it.path}:classes" })
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all locally run Spring services and the frontend.'
    dependsOn 'backendBuild', ':novafront:build'
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs the Docker-based integration tests for asynchronous email delivery.'
    dependsOn ':user-service:integrationTest', ':email-service:integrationTest'
}

tasks.register('configServerImage', Exec) {
    group = 'docker'
    description = 'Builds the config server jar and Docker image.'
    dependsOn ':config-server:bootJar'
    workingDir project(':config-server').projectDir
    commandLine 'docker', 'build', '-t', 'config-server', '.'
}

tasks.register('serviceImage', Exec) {
    group = 'docker'
    description = 'Builds one service and its Docker image. Use -Pservice=<name>.'
    dependsOn {
        [":${requestedService()}:build"]
    }
    doFirst {
        def serviceName = requestedService()
        workingDir project(":${serviceName}").projectDir
        commandLine 'docker', 'build', '-t', serviceName, '.'
    }
}

tasks.register('restartService', Exec) {
    group = 'docker'
    description = 'Builds and recreates one Docker Compose service. Use -Pservice=<name>.'
    dependsOn 'serviceImage'
    workingDir layout.projectDirectory.dir('builder')
    doFirst {
        commandLine(
            'docker-compose',
            '--env-file', '../.env',
            '-f', 'docker-compose.yml',
            'up', '-d',
            '--no-deps',
            '--force-recreate',
            requestedService()
        )
    }
}
